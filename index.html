<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Character Editor &amp; Transfer</title>
<style>
  :root {
    --bg: #12151c; --panel: #1a1f2a; --panel2: #222938; --line: #2e374a;
    --text: #e6e9f0; --muted: #8b95ab; --accent: #4da3ff; --accent2: #2f7fd6;
    --ok: #4cc38a; --warn: #f0b429; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 24px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 24px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent); }
  button.small { padding: 3px 9px; font-size: 13px; }
  button.danger { color: var(--bad); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); }
  button.primary.danger { background: #b83a3a; border-color: #b83a3a; color: #fff; }
  button.primary.danger:hover:not(:disabled) { background: var(--bad); border-color: var(--bad); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 8px 24px 32px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel.drag { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(77,163,255,.3); }
  .panel-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .slot-label { font-weight: 700; background: var(--panel2); border-radius: 5px; padding: 1px 8px; }
  .fname { flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .fname.loaded { color: var(--text); }
  .dirty { color: var(--warn); font-size: 12px; }
  .empty { padding: 36px 20px; text-align: center; color: var(--muted); }
  .error { padding: 10px 14px; color: var(--bad); background: rgba(255,107,107,.08); border-bottom: 1px solid var(--line); }
  .tools { padding: 10px 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
  .tools input { flex: 1; }
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: inherit; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  ul.chars { list-style: none; margin: 0; padding: 0; max-height: 68vh; overflow-y: auto; }
  ul.chars li { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  ul.chars li:last-child { border-bottom: none; }
  ul.chars li:hover { background: var(--panel2); }
  ul.chars li.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0%, 40% { background: rgba(76,195,138,.28); } 100% { background: transparent; } }
  .cname { flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 2px 0; cursor: pointer; color: var(--text); }
  .cname:hover { color: var(--accent); }
  .cname .nm { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cname .sd { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .count { color: var(--muted); font-size: 13px; padding: 8px 14px 0; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
           padding: 0; width: min(760px, 94vw); max-height: 92vh; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .dlg { display: flex; flex-direction: column; max-height: 92vh; }
  .dlg-head { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { margin: 0; font-size: 17px; }
  .dlg-head div { color: var(--muted); font-size: 12px; }
  .dlg-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .dlg-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .dlg-foot .grow { flex: 1; color: var(--muted); font-size: 12px; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  textarea.big { min-height: 300px; resize: vertical; line-height: 1.5; }
  textarea.mid { min-height: 110px; resize: vertical; }
  details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details summary { cursor: pointer; color: var(--muted); }
  details[open] summary { margin-bottom: 10px; }
  .sum { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .sum ul { margin: 4px 0 0; padding-left: 20px; }
  .sum .warn { color: var(--warn); }
  .opt { display: flex; gap: 8px; align-items: flex-start; }
  .opt input { margin-top: 4px; }
  input[type=number], select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; font: inherit; }
  input[type=number]:focus, select:focus { outline: none; border-color: var(--accent); }
  #editDlg { width: min(940px, 95vw); }
  .tabs { display: flex; gap: 4px; padding: 8px 18px 0; border-bottom: 1px solid var(--line); }
  .tab { border-radius: 6px 6px 0 0; border-bottom: none; background: transparent; color: var(--muted); }
  .tab.on { background: var(--panel2); color: var(--text); border-color: var(--accent); }
  .pane[hidden] { display: none; }
  .pane { display: flex; flex-direction: column; gap: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .fld { margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=text] { flex: 1; }
  .colorpick { width: 38px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); flex: none; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .big-card { margin-top: 0; }
  .cardhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sub { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  details.lb { padding: 8px 12px; }
  details.lb summary { color: var(--text); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  details.lb[open] > *:not(summary) { margin-top: 10px; }
  .warnbox { color: var(--warn); background: rgba(240,180,41,.08); border: 1px solid rgba(240,180,41,.35); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .badge.warnb { color: var(--warn); border-color: rgba(240,180,41,.5); }
  .badge.okb { color: var(--ok); border-color: rgba(76,195,138,.5); }
  .pickbox { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .sechead { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .sechead .grow { flex: 1; }
  label.pick { padding: 4px 0; border-top: 1px solid var(--line); align-items: center; }
  label.pick:first-of-type { border-top: none; }
  .plabel { flex: 1; }
  label.chk { align-items: center; }
  label.chk input { margin-top: 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ok); color: #06241a;
           padding: 10px 18px; border-radius: 8px; font-weight: 500; max-width: 90vw; opacity: 0; pointer-events: none;
           transition: opacity .25s; z-index: 50; }
  #toast.show { opacity: 1; }
  #toast.bad { background: var(--bad); color: #2a0707; }
</style>
</head>
<body>
<header>
  <h1>Novel Character Editor &amp; Transfer</h1>
  <p>Load up to two novel JSON files. Click a character to edit its description, or send a character across to the other file.</p>
  <span style="flex:1"></span>
  <button id="loadBoth" class="small">Load two files at once…</button>
  <input id="bothInput" type="file" accept=".json,application/json" multiple hidden>
</header>

<main>
  <section class="panel" id="panelA" data-slot="A"></section>
  <section class="panel" id="panelB" data-slot="B"></section>
</main>

<dialog id="editDlg"></dialog>
<dialog id="xferDlg"></dialog>
<dialog id="delDlg"></dialog>
<div id="toast"></div>

<!-- ============================ CORE (pure logic, no DOM) ============================ -->
<script id="core">
const Core = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));

  const uuid = () => {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  };

  // The novel content lives in data.novel for history exports; fall back to the root for plain exports.
  function getNovel(data) {
    if (data && data.novel && Array.isArray(data.novel.characters)) return data.novel;
    if (data && Array.isArray(data.characters)) return data;
    return null;
  }

  function parse(text) {
    const data = JSON.parse(text);
    if (!getNovel(data)) throw new Error('No character list found. This does not look like a novel JSON (expected novel.characters).');
    return data;
  }

  const characters = data => getNovel(data).characters;

  function ensureCard(c) {
    c.card = c.card || {};
    c.card.data = c.card.data || {};
    return c.card.data;
  }
  const getDescription = c => (c.card && c.card.data && c.card.data.description) || '';
  const outfitsOf = c => {
    const ext = c.card && c.card.data && c.card.data.extensions;
    return (ext && ext.mikugg_v2 && ext.mikugg_v2.outfits) || [];
  };

  // Textareas turn CRLF into LF. Only write a field back if the text really changed.
  const norm = s => (s || '').replace(/\r\n/g, '\n');
  function sameText(a, b) { return norm(a) === norm(b); }

  /**
   * Apply edits to a character in place. edits = { description, shortDescription, outfits: [text, ...] }
   * Returns true if anything changed.
   */
  function applyEdits(c, edits) {
    let changed = false;
    if (edits.description !== undefined && !sameText(edits.description, getDescription(c))) {
      ensureCard(c).description = edits.description; changed = true;
    }
    if (edits.shortDescription !== undefined && !sameText(edits.shortDescription, c.short_description)) {
      c.short_description = edits.shortDescription; changed = true;
    }
    if (edits.outfits) {
      const outs = outfitsOf(c);
      edits.outfits.forEach((t, i) => {
        if (outs[i] && !sameText(t, outs[i].description)) { outs[i].description = t; changed = true; }
      });
    }
    return changed;
  }

  const byId = arr => new Map((arr || []).map(x => [x.id, x]));
  // pick = { lorebooks: [ids], indicators: [ids], banks: [ids] }. A missing list means "everything".
  const wants = (pick, key, id) => !pick || !pick[key] || pick[key].includes(id);

  /**
   * Everything a character depends on, with its status in the target file. Feeds the transfer pick-lists.
   */
  function transferOptions(src, charId, dst) {
    const sN = getNovel(src), dN = getNovel(dst);
    const ch = sN.characters.find(c => c.id === charId);
    const sLore = byId(sN.lorebooks), dLore = byId(dN.lorebooks);
    const sInd = byId(sN.indicators), dInd = byId(dN.indicators);
    const sVar = byId(sN.variables), sBank = byId(sN.variableBanks), dBank = byId(dN.variableBanks);
    const o = { lorebooks: [], indicators: [], banks: [] };
    for (const id of ch.lorebookIds || []) {
      const lb = sLore.get(id); if (!lb) continue;
      o.lorebooks.push({ id, name: lb.name || '(unnamed)', isGlobal: !!lb.isGlobal, entries: (lb.entries || []).length, inTarget: dLore.has(id) });
    }
    for (const id of ch.indicatorIds || []) {
      const ind = sInd.get(id); if (!ind) continue;
      const v = sVar.get(ind.variableId), b = sBank.get(ind.bankId);
      o.indicators.push({ id, name: v ? v.name : '(missing variable)', type: v ? v.type : '', bank: b ? b.name : '', inTarget: dInd.has(id) });
    }
    for (const id of ch.variableBankIds || []) {
      const b = sBank.get(id); if (!b) continue;
      o.banks.push({ id, name: b.name || '(unnamed)', variables: (b.variables || []).length, inTarget: dBank.has(id) });
    }
    return o;
  }

  /**
   * Work out what moving a character from src to dst needs. Nothing is changed here.
   * opts.pick chooses which lorebooks / indicators / variable banks come along (default: all).
   * An item that is not picked is also unlinked from the transferred character.
   */
  function plan(src, charId, dst, opts = {}) {
    const pick = opts.pick;
    const sN = getNovel(src), dN = getNovel(dst);
    const ch = sN.characters.find(c => c.id === charId);
    if (!ch) throw new Error('Character not found in source file.');
    const existingIndex = dN.characters.findIndex(c => c.id === charId);
    const p = {
      charName: ch.name, existingIndex, conflict: existingIndex >= 0,
      lorebooksAdd: [], lorebooksReuse: 0, lorebooksSkipped: 0,
      indicatorsAdd: [], indicatorsReuse: 0, indicatorsSkipped: 0,
      variablesAdd: [], banksAdd: [], bankLinks: [], banksReuse: 0, banksSkipped: 0, warnings: []
    };

    // ---- lorebooks
    const sLore = byId(sN.lorebooks), dLore = byId(dN.lorebooks);
    for (const id of ch.lorebookIds || []) {
      if (!wants(pick, 'lorebooks', id)) { p.lorebooksSkipped++; continue; }
      if (dLore.has(id)) { p.lorebooksReuse++; continue; }
      const lb = sLore.get(id);
      if (!lb) { p.warnings.push('A lorebook this character pointed at is missing from the source file; the link was dropped.'); continue; }
      p.lorebooksAdd.push(clone(lb));
    }

    // ---- indicators -> variables -> banks
    const sInd = byId(sN.indicators), dInd = byId(dN.indicators);
    const sVar = byId(sN.variables), dVar = byId(dN.variables);
    const sBank = byId(sN.variableBanks), dBank = byId(dN.variableBanks);
    const varAddIds = new Set(), bankAddMap = new Map();

    const needBank = bankId => {
      if (dBank.has(bankId) || bankAddMap.has(bankId)) return true;
      const b = sBank.get(bankId);
      if (!b) return false;
      const nb = clone(b); nb.variables = [];
      bankAddMap.set(bankId, nb);
      return true;
    };
    const needVar = vid => {
      if (dVar.has(vid) || varAddIds.has(vid)) return true;
      const v = sVar.get(vid);
      if (!v) return false;
      varAddIds.add(vid); p.variablesAdd.push(clone(v)); return true;
    };
    const link = (bankId, vid) => {
      if (!p.bankLinks.some(l => l.bankId === bankId && l.variableId === vid)) p.bankLinks.push({ bankId, variableId: vid });
    };

    for (const id of ch.indicatorIds || []) {
      if (!wants(pick, 'indicators', id)) { p.indicatorsSkipped++; continue; }
      if (dInd.has(id)) { p.indicatorsReuse++; continue; }
      const ind = sInd.get(id);
      if (!ind || !needVar(ind.variableId) || !needBank(ind.bankId)) {
        p.warnings.push('An indicator this character used could not be resolved in the source file; the link was dropped.'); continue;
      }
      link(ind.bankId, ind.variableId);
      p.indicatorsAdd.push(clone(ind));
    }
    for (const bid of ch.variableBankIds || []) {
      if (!wants(pick, 'banks', bid)) { p.banksSkipped++; continue; }
      if (dBank.has(bid)) { p.banksReuse++; continue; }
      if (!needBank(bid)) { p.warnings.push('A variable bank this character used is missing from the source file.'); continue; }
      for (const vid of sBank.get(bid).variables || []) if (needVar(vid)) link(bid, vid);
    }
    p.banksAdd = [...bankAddMap.values()];
    return p;
  }

  /**
   * Do the transfer: mutates dst only. opts as for plan(), plus mode.
   * The character goes on the end of dst's character list (or replaces the same-id one in place).
   */
  function transfer(src, charId, dst, opts = {}) {
    const p = plan(src, charId, dst, opts);
    const pick = opts.pick;
    const sN = getNovel(src), dN = getNovel(dst);
    const ch = clone(sN.characters.find(c => c.id === charId));
    const mode = p.conflict ? (opts.mode || 'copy') : 'new';

    for (const k of ['lorebooks', 'indicators', 'variables', 'variableBanks']) if (!Array.isArray(dN[k])) dN[k] = [];

    for (const lb of p.lorebooksAdd) dN.lorebooks.push(lb);
    for (const v of p.variablesAdd) dN.variables.push(v);
    for (const b of p.banksAdd) dN.variableBanks.push(b);
    for (const { bankId, variableId } of p.bankLinks) {
      const b = dN.variableBanks.find(x => x.id === bankId);
      if (b) { b.variables = b.variables || []; if (!b.variables.includes(variableId)) b.variables.push(variableId); }
    }
    for (const i of p.indicatorsAdd) dN.indicators.push(i);

    // The character keeps only the links that were picked AND exist in dst now.
    const have = arr => new Set(dN[arr].map(x => x.id));
    const L = have('lorebooks'), I = have('indicators'), B = have('variableBanks');
    if (ch.lorebookIds) ch.lorebookIds = ch.lorebookIds.filter(id => L.has(id) && wants(pick, 'lorebooks', id));
    if (ch.indicatorIds) ch.indicatorIds = ch.indicatorIds.filter(id => I.has(id) && wants(pick, 'indicators', id));
    if (ch.variableBankIds) ch.variableBankIds = ch.variableBankIds.filter(id => B.has(id) && wants(pick, 'banks', id));

    if (mode === 'copy') {
      ch.id = uuid();
      for (const o of outfitsOf(ch)) o.id = uuid();
      dN.characters.push(ch);
    } else if (mode === 'replace') {
      dN.characters[p.existingIndex] = ch;
    } else {
      dN.characters.push(ch);
    }
    return { plan: p, mode, newId: ch.id };
  }

  // ---------------- per-character lorebooks / indicators / variables ----------------

  /**
   * Lorebooks the character is tagged with, leaving out global ones.
   * Each item says who else uses it, because editing a shared lorebook changes it for all of them.
   */
  function charLorebooks(data, charId) {
    const n = getNovel(data), ch = n.characters.find(c => c.id === charId), lore = byId(n.lorebooks);
    const items = []; let globals = 0;
    for (const id of ch.lorebookIds || []) {
      const lb = lore.get(id); if (!lb) continue;
      if (lb.isGlobal) { globals++; continue; }
      items.push({
        lorebook: lb,
        sharedWith: n.characters.filter(c => c.id !== charId && (c.lorebookIds || []).includes(id)).map(c => c.name),
        scenes: (n.scenes || []).filter(s => (s.lorebookIds || []).includes(id)).length
      });
    }
    return { items, globals };
  }

  /**
   * Indicators tagged on the character (each with its variable and bank), plus the variables of any
   * variable banks tagged on the character.
   */
  function charIndicators(data, charId) {
    const n = getNovel(data), ch = n.characters.find(c => c.id === charId);
    const ind = byId(n.indicators), vars = byId(n.variables), banks = byId(n.variableBanks);
    const objs = [...(n.objectives || []), ...((data !== n && data.objectives) || [])];
    const objText = new Map(); for (const o of objs) objText.set(o.id, JSON.stringify(o));
    const objectivesUsing = vid => { let k = 0; for (const t of objText.values()) if (t.includes(vid)) k++; return k; };
    const items = [];
    for (const id of ch.indicatorIds || []) {
      const i = ind.get(id); if (!i) continue;
      const v = vars.get(i.variableId) || null;
      items.push({
        indicator: i, variable: v, bank: banks.get(i.bankId) || null,
        sharedWith: n.characters.filter(c => c.id !== charId && (c.indicatorIds || []).includes(id)).map(c => c.name),
        scenes: (n.scenes || []).filter(s => (s.indicatorIds || []).includes(id)).length,
        objectives: v ? objectivesUsing(v.id) : 0
      });
    }
    const taggedBanks = [];
    for (const bid of ch.variableBankIds || []) {
      const b = banks.get(bid); if (!b) continue;
      taggedBanks.push({
        bank: b,
        sharedWith: n.characters.filter(c => c.id !== charId && (c.variableBankIds || []).includes(bid)).map(c => c.name),
        variables: (b.variables || []).map(vid => vars.get(vid)).filter(Boolean).map(v => ({ variable: v, objectives: objectivesUsing(v.id) }))
      });
    }
    return { items, banks: taggedBanks };
  }

  /**
   * Write edited copies back into the novel, matching by id and keeping list order.
   * copies = { lorebooks: [...], indicators: [...], variables: [...] }. Returns how many items really changed.
   */
  function commitCopies(data, copies) {
    const n = getNovel(data); let changed = 0;
    for (const key of ['lorebooks', 'indicators', 'variables']) {
      for (const item of copies[key] || []) {
        const arr = n[key] || [];
        const i = arr.findIndex(x => x.id === item.id);
        if (i >= 0 && JSON.stringify(arr[i]) !== JSON.stringify(item)) { arr[i] = item; changed++; }
      }
    }
    return changed;
  }

  /**
   * Count where a character is used. Nothing is changed.
   * scenes / cutsceneParts / starts can be cleaned up automatically; objectives and narration are only reported.
   */
  function referencesOf(data, charId) {
    const n = getNovel(data);
    const r = { scenes: 0, cutsceneParts: 0, starts: 0, objectives: 0, narration: 0 };
    for (const s of n.scenes || []) if ((s.characters || []).some(c => c.characterId === charId)) r.scenes++;
    for (const cs of n.cutscenes || []) for (const pt of cs.parts || []) if ((pt.characters || []).some(c => c.id === charId)) r.cutsceneParts++;
    for (const st of n.starts || []) if ((st.characters || []).some(c => c.characterId === charId)) r.starts++;
    const seen = new Set(), lists = [n.objectives];
    if (data !== n) lists.push(data.objectives);
    for (const list of lists) for (const o of list || []) {
      const ids = o && o.stateCondition && o.stateCondition.config && o.stateCondition.config.characterIds;
      if (Array.isArray(ids) && ids.includes(charId)) seen.add(o.id);
    }
    r.objectives = seen.size;
    const resp = data.narration && data.narration.responses;
    if (resp) for (const x of Object.values(resp)) {
      if (x.selectedCharacterId === charId || (x.characters || []).some(c => c.characterId === charId)) r.narration++;
    }
    return r;
  }

  /**
   * Remove a character from the character list. With stripRefs (default) it is also taken out of
   * scenes, start screens and cutscenes. Objective conditions and saved play history are never edited.
   */
  function deleteCharacter(data, charId, opts = {}) {
    const stripRefs = opts.stripRefs !== false;
    const n = getNovel(data);
    const idx = n.characters.findIndex(c => c.id === charId);
    if (idx < 0) throw new Error('Character not found.');
    const name = n.characters[idx].name;
    const refs = referencesOf(data, charId);
    n.characters.splice(idx, 1);
    if (stripRefs) {
      for (const s of n.scenes || []) if (s.characters) s.characters = s.characters.filter(c => c.characterId !== charId);
      for (const st of n.starts || []) if (st.characters) st.characters = st.characters.filter(c => c.characterId !== charId);
      for (const cs of n.cutscenes || []) for (const pt of cs.parts || []) if (pt.characters) pt.characters = pt.characters.filter(c => c.id !== charId);
    }
    return { name, refs, stripped: stripRefs };
  }

  function serialize(text, data) {
    const m = text.match(/^\s*[\{\[]\r?\n([ \t]+)"/);
    return JSON.stringify(data, null, m ? m[1] : 0);
  }

  return { clone, uuid, getNovel, parse, characters, getDescription, outfitsOf, applyEdits, plan, transfer, transferOptions, charLorebooks, charIndicators, commitCopies, referencesOf, deleteCharacter, serialize, sameText };
})();

<!-- ============================ UI ============================ -->
<script id="ui">
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) e.append(kid);
    return e;
  };

  const slots = {
    A: { name: '', text: '', data: null, dirty: false, error: '', filter: '', flashId: null, undo: null },
    B: { name: '', text: '', data: null, dirty: false, error: '', filter: '', flashId: null, undo: null }
  };
  const other = k => (k === 'A' ? 'B' : 'A');

  let toastTimer;
  function toast(msg, bad) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 5000);
  }

  // ---------- file loading ----------
  function readFile(k, file) {
    const s = slots[k];
    return file.text().then(text => {
      try {
        const data = Core.parse(text);
        Object.assign(s, { name: file.name, text, data, dirty: false, error: '', filter: '', flashId: null, undo: null });
      } catch (e) {
        Object.assign(s, { name: file.name, text: '', data: null, dirty: false, undo: null, error: 'Could not load ' + file.name + ': ' + e.message });
      }
      render(k);
    });
  }

  function pickInto(k) {
    const inp = el('input', { type: 'file', accept: '.json,application/json' });
    inp.addEventListener('change', () => { if (inp.files[0]) readFile(k, inp.files[0]); });
    inp.click();
  }

  // ---------- panel rendering ----------
  function render(k) {
    const s = slots[k], panel = $('#panel' + k);
    panel.replaceChildren();

    const head = el('div', { class: 'panel-head' },
      el('span', { class: 'slot-label', text: 'File ' + k }),
      el('span', { class: 'fname' + (s.data ? ' loaded' : ''), text: s.name || 'No file loaded', title: s.name }),
      s.dirty ? el('span', { class: 'dirty', text: '● unsaved changes' }) : null,
      el('button', { class: 'small', text: s.data ? 'Replace…' : 'Choose file…', onclick: () => pickInto(k) })

    panel.append(head);
    if (s.error) panel.append(el('div', { class: 'error', text: s.error }));

    if (!s.data) {

    }

    const chars = Core.characters(s.data);
    const filter = el('input', { type: 'text', placeholder: 'Filter characters…', value: s.filter });
    const list = el('ul', { class: 'chars' });
    const count = el('div', { class: 'count' });

    const fillList = () => {
      list.replaceChildren();
      const q = s.filter.trim().toLowerCase();
      let shown = 0, flashEl = null;
      chars.forEach(c => {
        if (q && !(c.name || '').toLowerCase().includes(q)) return;
        shown++;
        const li = el('li', { class: s.flashId === c.id ? 'flash' : '' },
          el('button', { class: 'cname', title: 'Edit description', onclick: () => openEditor(k, c.id) },
            el('span', { class: 'nm', text: c.name || '(unnamed)' }),
            el('span', { class: 'sd', text: c.short_description || '' })),
          c.hidden ? el('span', { class: 'badge', text: 'hidden' }) : null,
          el('button', {
            class: 'small', title: 'Send this character to File ' + other(k), disabled: slots[other(k)].data ? null : 'disabled',
            text: k === 'A' ? 'Send to B →' : '← Send to A', onclick: () => openTransfer(k, c.id)
          }),
          el('button', { class: 'small danger', title: 'Delete this character from File ' + k, text: 'Delete', onclick: () => openDelete(k, c.id) })
        );
        if (s.flashId === c.id) flashEl = li;
        list.append(li);
      });
      count.textContent = (q ? shown + ' of ' : '') + chars.length + ' character' + (chars.length === 1 ? '' : 's');
      if (flashEl) { flashEl.scrollIntoView({ block: 'nearest' }); s.flashId = null; }
    };
    filter.addEventListener('input', () => { s.filter = filter.value; fillList(); });

    panel.append(
      el('div', { class: 'tools' }, filter,
        s.undo ? el('button', {
          class: 'small', text: 'Undo delete', title: 'Put back ' + s.undo.name,
          onclick: () => {
            const u = s.undo; s.data = u.data; s.dirty = u.dirty; s.undo = null; s.filter = ''; s.flashId = u.charId;
            render(k); toast('Restored ' + u.name + '.');

        el('button', {
          class: 'small', text: 'Reset', title: 'Discard all changes and reload the file as uploaded',
          disabled: s.dirty ? null : 'disabled',
          onclick: () => { s.data = Core.parse(s.text); s.dirty = false; s.undo = null; render(k); toast('File ' + k + ' reset to the uploaded version.'); }
        }),
        el('button', { class: 'primary small', text: 'Download ⬇', onclick: () => download(k) })
      ),
      count, list
    );
    fillList();
    // updateXferButtons for the other panel is handled by render() callers
  }

  function download(k) {
    const s = slots[k];
    const out = Core.serialize(s.text, s.data);
    const stem = s.name.replace(/\.json$/i, '');
    const blob = new Blob([out], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: stem + (s.dirty ? '_edited' : '') + '.json' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Downloaded ' + a.download);
  }

  // ---------- small form helpers (edit a working copy in place, only when the user types) ----------
  const fld = (label, node) => el('div', { class: 'fld' }, el('label', { class: 'f', text: label }), node);
  function textInput(obj, key, placeholder) {
    const i = el('input', { type: 'text', placeholder: placeholder || '' });
    i.value = obj[key] == null ? '' : String(obj[key]);
    i.addEventListener('input', () => { obj[key] = i.value; });
    return i;
  }
  function areaInput(obj, key, cls) {
    const t = el('textarea', { class: cls || 'mid', spellcheck: 'false' });
    t.value = obj[key] == null ? '' : String(obj[key]);
    t.addEventListener('input', () => { obj[key] = t.value; });
    return t;
  }
  function numInput(obj, key) {
    const i = el('input', { type: 'number', step: 'any' });
    i.value = obj[key] == null ? '' : obj[key];
    i.addEventListener('input', () => { const v = i.value.trim(); if (v !== '' && !isNaN(Number(v))) obj[key] = Number(v); });
    return i;
  }
  function checkInput(obj, key, text) {
    const i = el('input', { type: 'checkbox' });
    i.checked = !!obj[key];
    i.addEventListener('change', () => { obj[key] = i.checked; });
    return el('label', { class: 'opt chk' }, i, el('span', { text }));
  }
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const nameList = (names, max = 6) => names.slice(0, max).join(', ') + (names.length > max ? ' and ' + (names.length - max) + ' more' : '');

  // A variable: name, description, value (by type). Edits go straight to the working copy `v`.
  function variableFields(v) {
    const box = el('div', {});
    box.append(fld('Variable name', textInput(v, 'name')), fld('Description (tells the AI what this variable means)', areaInput(v, 'description', 'mid')));
    if (v.type === 'boolean') {
      box.append(fld('Starting value', checkInput(v, 'value', 'On (true)')));
    } else if (v.type === 'number') {
      box.append(fld('Starting value', numInput(v, 'value')));
    } else if (v.type === 'discrete') {
      const sel = el('select');
      const fill = () => {
        sel.replaceChildren();
        const vals = v.discreteValues || [];
        (vals.includes(v.value) ? vals : [v.value, ...vals]).forEach(o => sel.append(el('option', { value: o, text: o })));
        sel.value = v.value;
      };
      fill(); sel.addEventListener('change', () => { v.value = sel.value; });
      const list = el('textarea', { class: 'mid', spellcheck: 'false' });
      list.value = (v.discreteValues || []).join('\n');
      list.addEventListener('input', () => { v.discreteValues = list.value.split('\n').filter(x => x !== ''); fill(); });
      box.append(fld('Starting value', sel), fld('Allowed values (one per line)', list));
    } else {
      box.append(fld('Starting value', textInput(v, 'value')));
    }
    return box;
  }

  // An indicator: how the variable is displayed.
  function indicatorFields(ind) {
    const color = el('input', { type: 'text' }); color.value = ind.color || '';
    const picker = el('input', { type: 'color', class: 'colorpick' });
    if (/^#[0-9a-f]{6}$/i.test(ind.color || '')) picker.value = ind.color; else picker.disabled = true;
    color.addEventListener('input', () => { ind.color = color.value; if (/^#[0-9a-f]{6}$/i.test(color.value)) { picker.disabled = false; picker.value = color.value; } });
    picker.addEventListener('input', () => { ind.color = picker.value; color.value = picker.value; });
    const disp = el('select', {}, el('option', { value: '', text: 'Plain number' }), el('option', { value: 'percentage', text: 'Percentage' }));
    disp.value = ind.numericType || '';
    disp.addEventListener('change', () => { if (disp.value) ind.numericType = disp.value; else delete ind.numericType; });
    return el('div', { class: 'grid' },
      fld('Colour', el('div', { class: 'row' }, picker, color)),
      fld('Display', disp),
      fld('Minimum', numInput(ind, 'min')), fld('Maximum', numInput(ind, 'max')), fld('Step', numInput(ind, 'step')),
      el('div', { class: 'fld checks' }, checkInput(ind, 'hidden', 'Hidden'), checkInput(ind, 'editable', 'Player can edit'), checkInput(ind, 'persistent', 'Persistent'))
    );
  }

  // ---------- character editor: description, lorebooks, indicators ----------
  function openEditor(k, charId) {
    const s = slots[k];
    const c = Core.characters(s.data).find(x => x.id === charId);
    const dlg = $('#editDlg');

    // ----- Description tab
    const desc = el('textarea', { class: 'big', spellcheck: 'false' }); desc.value = Core.getDescription(c);
    const short = el('textarea', { class: 'mid', style: 'min-height:60px', spellcheck: 'false' }); short.value = c.short_description || '';
    const outfits = Core.outfitsOf(c);
    const outAreas = outfits.map(o => { const t = el('textarea', { class: 'mid', spellcheck: 'false' }); t.value = o.description || ''; return t; });
    const counter = el('span', { class: 'grow' });
    const upd = () => { counter.textContent = desc.value.length + ' characters in description'; };
    desc.addEventListener('input', upd); upd();
    const descPane = el('div', { class: 'pane' },
      fld('Description', desc),
      el('details', {},
        el('summary', { text: 'Short description & outfits' }),
        el('div', {}, el('label', { class: 'f', text: 'Short description (shown in lists)' }), short),
        ...outfits.map((o, i) => el('div', { style: 'margin-top:10px' }, el('label', { class: 'f', text: 'Outfit: ' + (o.name || '(unnamed)') }), outAreas[i]))
      ));

    // ----- Lorebooks tab (character-specific only; working copies)
    const lore = Core.charLorebooks(s.data, charId);
    const loreCopies = lore.items.map(it => Object.assign({}, it, { copy: Core.clone(it.lorebook) }));
    const lorePane = el('div', { class: 'pane', hidden: 'hidden' });
    if (!loreCopies.length) lorePane.append(el('div', { class: 'muted', text: 'This character has no lorebooks of its own.' }));
    for (const it of loreCopies) {
      const lb = it.copy;
      if (!Array.isArray(lb.entries)) lb.entries = [];
      const title = el('b', { text: lb.name || '(unnamed)' }), count = el('span', { class: 'badge' });
      const entriesBox = el('div', { class: 'entries' });
      const renderEntries = () => {
        entriesBox.replaceChildren();
        count.textContent = plural(lb.entries.length, 'entry', 'entries');
        lb.entries.forEach((e, idx) => {
          const keys = el('input', { type: 'text', placeholder: 'trigger words, separated by commas' });
          keys.value = (e.keys || []).join(', ');
          keys.addEventListener('input', () => { e.keys = keys.value.split(',').map(x => x.trim()).filter(Boolean); });
          entriesBox.append(el('div', { class: 'card' },
            el('div', { class: 'row' }, textInput(e, 'name', 'Entry name'), el('button', { class: 'small danger', text: 'Delete entry', onclick: () => { lb.entries.splice(idx, 1); renderEntries(); } })),
            fld('Trigger keys', keys), fld('Content', areaInput(e, 'content', 'mid'))));
        });
      };
      renderEntries();
      const nameInp = textInput(lb, 'name'); nameInp.addEventListener('input', () => { title.textContent = lb.name || '(unnamed)'; });
      const notes = [];
      if (it.sharedWith.length) notes.push('Shared with ' + plural(it.sharedWith.length, 'other character') + ' (' + nameList(it.sharedWith) + '). Editing it changes it for all of them.');
      if (it.scenes) notes.push('Also used by ' + plural(it.scenes, 'scene') + '.');
      lorePane.append(el('details', { class: 'lb', ...(loreCopies.length === 1 ? { open: 'open' } : {}) },
        el('summary', {}, title, ' ', count, it.sharedWith.length ? el('span', { class: 'badge warnb', text: 'shared' }) : null),
        ...notes.map(t => el('div', { class: 'warnbox', text: '⚠ ' + t })),
        fld('Lorebook name', nameInp), fld('Description', areaInput(lb, 'description', 'mid')),
        entriesBox,
        el('button', {
          class: 'small', text: '+ Add entry', onclick: () => {
            lb.entries.push({ keys: [], name: 'New entry', content: '', extensions: {}, enabled: lb.entries[0] ? lb.entries[0].enabled : false, insertion_order: 0 });
            renderEntries(); entriesBox.lastElementChild.scrollIntoView({ block: 'nearest' });
          }
        })));
    }
    if (lore.globals) lorePane.append(el('div', { class: 'muted', text: plural(lore.globals, 'global lorebook') + (lore.globals === 1 ? ' also applies' : ' also apply') + ' to this character but ' + (lore.globals === 1 ? 'is' : 'are') + ' not shown here.' }));

    // ----- Indicators tab (tagged indicators + their variables; variables of tagged banks)
    const inds = Core.charIndicators(s.data, charId);
    const varClones = new Map(), indClones = new Map();
    const varOf = v => { if (!varClones.has(v.id)) varClones.set(v.id, Core.clone(v)); return varClones.get(v.id); };
    const indPane = el('div', { class: 'pane', hidden: 'hidden' });
    if (!inds.items.length && !inds.banks.length) indPane.append(el('div', { class: 'muted', text: 'This character has no indicators of its own.' }));
    for (const it of inds.items) {
      const ind = Core.clone(it.indicator); indClones.set(ind.id, ind);
      const v = it.variable ? varOf(it.variable) : null;
      const notes = [];
      if (it.sharedWith.length) notes.push('Shared with ' + plural(it.sharedWith.length, 'other character') + ' (' + nameList(it.sharedWith) + '). Editing it changes it for all of them.');
      if (it.scenes) notes.push('This indicator is shown in ' + plural(it.scenes, 'scene') + '.');
      if (it.objectives) notes.push('This variable is used by ' + plural(it.objectives, 'objective') + '. Renaming or re-typing it can break their logic.');
      indPane.append(el('div', { class: 'card big-card' },
        el('div', { class: 'cardhead' }, el('b', { text: v ? v.name : '(variable missing)' }),
          v ? el('span', { class: 'badge', text: v.type }) : null, it.bank ? el('span', { class: 'badge', text: 'bank: ' + it.bank.name }) : null,
          it.sharedWith.length ? el('span', { class: 'badge warnb', text: 'shared' }) : null),
        ...notes.map(t => el('div', { class: 'warnbox', text: '⚠ ' + t })),
        v ? el('div', {}, el('div', { class: 'sub', text: 'Variable' }), variableFields(v)) : el('div', { class: 'warnbox', text: '⚠ The variable this indicator points at is missing from the file.' }),
        el('div', { class: 'sub', text: 'Indicator display' }), indicatorFields(ind)));
    }
    for (const tb of inds.banks) {
      indPane.append(el('div', { class: 'sub', text: 'Variables in tagged bank “' + tb.bank.name + '”' + (tb.sharedWith.length ? ' (shared with ' + plural(tb.sharedWith.length, 'other character') + ')' : '') }));
      for (const bv of tb.variables) {
        const v = varOf(bv.variable);
        indPane.append(el('div', { class: 'card big-card' },
          el('div', { class: 'cardhead' }, el('b', { text: v.name }), el('span', { class: 'badge', text: v.type })),
          bv.objectives ? el('div', { class: 'warnbox', text: '⚠ This variable is used by ' + plural(bv.objectives, 'objective') + '. Renaming or re-typing it can break their logic.' }) : null,
          variableFields(v)));
      }
    }

    // ----- tabs
    const panes = { desc: descPane, lore: lorePane, ind: indPane };
    const tabBtns = {};
    const showTab = key => { for (const [kk, p] of Object.entries(panes)) { p.hidden = kk !== key; tabBtns[kk].classList.toggle('on', kk === key); } counter.style.visibility = key === 'desc' ? 'visible' : 'hidden'; };
    const tabs = el('div', { class: 'tabs' });
    [['desc', 'Description'], ['lore', 'Lorebooks (' + loreCopies.length + ')'], ['ind', 'Indicators (' + (inds.items.length + inds.banks.reduce((a, b) => a + b.variables.length, 0)) + ')']].forEach(([key, label]) => {
      tabBtns[key] = el('button', { class: 'tab', text: label, onclick: () => showTab(key) }); tabs.append(tabBtns[key]);
    });

    const save = () => {
      const descChanged = Core.applyEdits(c, { description: desc.value, shortDescription: short.value, outfits: outAreas.map(t => t.value) });
      const n = Core.commitCopies(s.data, { lorebooks: loreCopies.map(x => x.copy), indicators: [...indClones.values()], variables: [...varClones.values()] });
      dlg.close();

      }

    dlg.replaceChildren(el('div', { class: 'dlg' },
      el('div', { class: 'dlg-head' }, el('h2', { text: c.name }), el('div', { text: 'File ' + k + ' · ' + s.name })),
      tabs,
      el('div', { class: 'dlg-body' }, descPane, lorePane, indPane),
      el('div', { class: 'dlg-foot' }, counter,
        el('button', { text: 'Cancel', onclick: () => dlg.close() }),
        el('button', { class: 'primary', text: 'Save', onclick: save }))
    ));
    showTab('desc');
    dlg.showModal(); desc.focus();
  }

  // ---------- transfer: pick exactly what comes along ----------
  function openTransfer(from, charId) {
    const to = other(from), src = slots[from], dst = slots[to];
    if (!dst.data) { toast('Load a file into File ' + to + ' first.', true); return; }
    const dlg = $('#xferDlg');
    const opts = Core.transferOptions(src.data, charId, dst.data);
    const picked = { lorebooks: new Set(opts.lorebooks.map(x => x.id)), indicators: new Set(opts.indicators.map(x => x.id)), banks: new Set(opts.banks.map(x => x.id)) };
    const exists = Core.characters(dst.data).some(x => x.id === charId);
    let mode = 'copy';
    const pickArg = () => ({ lorebooks: [...picked.lorebooks], indicators: [...picked.indicators], banks: [...picked.banks] });
    const status = it => el('span', { class: 'badge ' + (it.inTarget ? 'okb' : ''), text: it.inTarget ? 'already in File ' + to + ' (will link to that one)' : 'will be copied' });

    const summary = el('div', { class: 'sum' });
    const drawSummary = () => {
      const p = Core.plan(src.data, charId, dst.data, { pick: pickArg() });
      const ul = el('ul'); const li = t => ul.append(el('li', { text: t }));
      li('The character itself: description, outfits, emotions, images and settings.');
      if (p.lorebooksAdd.length) li('Lorebooks copied: ' + p.lorebooksAdd.map(l => l.name || l.id).join(', '));
      if (p.indicatorsAdd.length) li('Indicators copied: ' + plural(p.indicatorsAdd.length, 'indicator') + ', with ' + plural(p.variablesAdd.length, 'variable') + (p.banksAdd.length ? ' and bank ' + p.banksAdd.map(b => '“' + b.name + '”').join(', ') : ''));
      else if (p.variablesAdd.length) li('Variables copied: ' + p.variablesAdd.length);
      const linked = p.lorebooksReuse + p.indicatorsReuse + p.banksReuse;
      if (linked) li(plural(linked, 'item') + ' File ' + to + ' already has will just be linked.');
      const skipped = p.lorebooksSkipped + p.indicatorsSkipped + p.banksSkipped;
      if (skipped) li(plural(skipped, 'unticked item') + ' will be left out and unlinked from the transferred character.');
      li('Scenes, cutscenes and objectives that mention this character stay in File ' + from + '.');
      summary.replaceChildren(el('div', { text: 'This will add to the bottom of File ' + to + ':' }), ul, ...p.warnings.map(w => el('div', { class: 'warn', text: '⚠ ' + w })));
    };

    const section = (title, key, items, describe) => {
      if (!items.length) return null;
      const boxes = items.map(it => {
        const cb = el('input', { type: 'checkbox', checked: 'checked' });
        cb.addEventListener('change', () => { if (cb.checked) picked[key].add(it.id); else picked[key].delete(it.id); drawSummary(); });
        return { cb, it, row: el('label', { class: 'opt pick' }, cb, describe(it)) };
      });
      const setAll = v => { boxes.forEach(({ cb, it }) => { cb.checked = v; if (v) picked[key].add(it.id); else picked[key].delete(it.id); }); drawSummary(); };
      return el('div', { class: 'pickbox' },
        el('div', { class: 'sechead' }, el('b', { text: title }), el('span', { class: 'grow' }),
          el('button', { class: 'small', text: 'All', onclick: () => setAll(true) }), el('button', { class: 'small', text: 'None', onclick: () => setAll(false) })),
        ...boxes.map(b => b.row));
    };

    const body = el('div', { class: 'dlg-body' });
    const secs = [
      section('Lorebooks', 'lorebooks', opts.lorebooks, it => el('span', { class: 'plabel' }, el('span', { text: it.name + ' · ' + plural(it.entries, 'entry', 'entries') + ' ' }), it.isGlobal ? el('span', { class: 'badge', text: 'global' }) : null, ' ', status(it))),
      section('Indicators (each one comes with its variable)', 'indicators', opts.indicators, it => el('span', { class: 'plabel' }, el('span', { text: it.name + (it.type ? ' · ' + it.type : '') + (it.bank ? ' · bank: ' + it.bank : '') + ' ' }), status(it))),
      section('Variable banks tagged on the character (each comes with all its variables)', 'banks', opts.banks, it => el('span', { class: 'plabel' }, el('span', { text: it.name + ' · ' + plural(it.variables, 'variable') + ' ' }), status(it)))
    ].filter(Boolean);
    if (secs.length) body.append(...secs); else body.append(el('div', { class: 'muted', text: 'This character has no lorebooks, indicators or variable banks to bring along.' }));
    body.append(summary);
    if (exists) {
      body.append(el('div', { class: 'sum' },
        el('div', { class: 'warn', text: '⚠ File ' + to + ' already has a character with this exact ID.' }),
        el('label', { class: 'opt' }, el('input', { type: 'radio', name: 'mode', value: 'copy', checked: 'checked', onchange: () => { mode = 'copy'; } }), el('span', { text: 'Add as a separate character (gets a new ID)' })),
        el('label', { class: 'opt' }, el('input', { type: 'radio', name: 'mode', value: 'replace', onchange: () => { mode = 'replace'; } }), el('span', { text: 'Replace the existing one in place (scenes in File ' + to + ' keep working)' }))));
    }
    drawSummary();

    const go = () => {
      const res = Core.transfer(src.data, charId, dst.data, { pick: pickArg(), mode });
      dlg.close();
      dst.dirty = true; dst.undo = null; dst.flashId = res.newId; dst.filter = '';
      render(to);
      toast('“' + res.plan.charName + '” ' + (res.mode === 'replace' ? 'replaced in' : 'added to the bottom of') + ' File ' + to + '. Download File ' + to + ' to keep it.');
    };

    dlg.replaceChildren(el('div', { class: 'dlg' },
      el('div', { class: 'dlg-head' }, el('h2', { text: 'Send “' + Core.characters(src.data).find(c => c.id === charId).name + '” to File ' + to }),
        el('div', { text: 'Tick what should come along. File ' + from + ' is not changed.' })),
      body,
      el('div', { class: 'dlg-foot' }, el('span', { class: 'grow' }),
        el('button', { text: 'Cancel', onclick: () => dlg.close() }),
        el('button', { class: 'primary', text: 'Transfer', onclick: go }))
    ));
    dlg.showModal();
  }

  // ---------- delete ----------
  function openDelete(k, charId) {
    const s = slots[k];
    const c = Core.characters(s.data).find(x => x.id === charId);
    const r = Core.referencesOf(s.data, charId);
    const dlg = $('#delDlg');
    let strip = true;
    const used = r.scenes + r.cutsceneParts + r.starts;
    const body = el('div', { class: 'dlg-body' });

    const draw = () => {
      body.replaceChildren();
      const ul = el('ul');
      const li = t => ul.append(el('li', { text: t }));
      if (r.scenes) li('used in ' + r.scenes + ' scene' + (r.scenes === 1 ? '' : 's'));
      if (r.cutsceneParts) li('shown in ' + r.cutsceneParts + ' cutscene part' + (r.cutsceneParts === 1 ? '' : 's'));
      if (r.starts) li('used in ' + r.starts + ' start screen' + (r.starts === 1 ? '' : 's'));
      if (!used) li('not used in any scene, cutscene or start screen');
      body.append(el('div', { class: 'sum' }, el('div', { text: '“' + c.name + '” is:' }), ul));
      if (used) {
        body.append(el('label', { class: 'opt' },
          el('input', { type: 'checkbox', ...(strip ? { checked: 'checked' } : {}), onchange: e => { strip = e.target.checked; } }),
          el('span', { text: 'Also remove them from those scenes, cutscenes and start screens (recommended; otherwise they keep pointing at a character that no longer exists)' })));
      }
      const warns = [];
      if (r.objectives) warns.push(r.objectives + ' objective condition' + (r.objectives === 1 ? '' : 's') + ' mention this character and will not be changed. Check them in miku.gg.');
      if (r.narration) warns.push('The saved play history in this file mentions this character and will not be changed. If the game misbehaves on load, start a fresh playthrough.');
      if (warns.length) body.append(el('div', { class: 'sum' }, ...warns.map(w => el('div', { class: 'warn', text: '⚠ ' + w }))));
      body.append(el('div', { class: 'sum', text: 'Lorebooks, indicators and variables this character used stay in the file. You can undo straight afterwards, or Reset to the uploaded version.' }));
    };
    draw();

    const go = () => {
      const snapshot = { name: c.name, charId, data: Core.clone(s.data), dirty: s.dirty };
      const res = Core.deleteCharacter(s.data, charId, { stripRefs: strip });
      dlg.close();
      s.undo = snapshot; s.dirty = true;
      render(k);
      toast('Deleted “' + res.name + '” from File ' + k + '. Download File ' + k + ' to keep the change.');
    };

    dlg.replaceChildren(el('div', { class: 'dlg' },
      el('div', { class: 'dlg-head' }, el('h2', { text: 'Delete “' + c.name + '” from File ' + k + '?' }), el('div', { text: s.name })),
      body,
      el('div', { class: 'dlg-foot' }, el('span', { class: 'grow' }),
        el('button', { text: 'Cancel', onclick: () => dlg.close() }),
        el('button', { class: 'primary danger', text: 'Delete character', onclick: go }))
    ));
    dlg.showModal();
  }

  // ---------- wiring ----------
  $('#loadBoth').addEventListener('click', () => $('#bothInput').click());
  $('#bothInput').addEventListener('change', e => {
    const files = [...e.target.files];
    if (files[0]) readFile('A', files[0]);
    if (files[1]) readFile('B', files[1]);
    if (files.length > 2) toast('Only the first two files were loaded.', true);
    e.target.value = '';
  });

  for (const k of ['A', 'B']) {
    const p = $('#panel' + k);
    p.addEventListener('dragover', e => { e.preventDefault(); p.classList.add('drag'); });
    p.addEventListener('dragleave', () => p.classList.remove('drag'));
    p.addEventListener('drop', e => {
      e.preventDefault(); p.classList.remove('drag');
      const files = [...e.dataTransfer.files];
      if (files[0]) readFile(k, files[0]);
      if (files[1]) readFile(other(k), files[1]);   // two files dropped together fill both slots
    });
  }
  // Keep the "Send" buttons in sync when the other file is loaded or changed.
  const _render = render;
  render = function (k) { _render(k); if (slots[other(k)].data) _render(other(k)); };

  window.addEventListener('beforeunload', e => {
    if (slots.A.dirty || slots.B.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  _render('A'); _render('B');
  window.__slots = slots;   // handy for debugging in the console
})();
</script>
</body>
</html>
